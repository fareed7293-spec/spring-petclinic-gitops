apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spring-petclinic
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/fareed7293-spec/spring-petclinic-gitops.git'
    targetRevision: main
    path: apps/spring-petclinic
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: spring-petclinic
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
